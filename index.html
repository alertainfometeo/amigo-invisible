<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🎄 Amigo invisible familia Linares-Moreno 🎁</title>
<style>
  :root { --rojo:#b3202a; --verde:#1f5f3f; --crema:#fdf6ec; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    font-family: Georgia, "Times New Roman", serif; color:#2a2a2a;
    background: radial-gradient(circle at 20% 20%, #2b7a52 0, var(--verde) 60%); padding:20px; }
  .tarjeta { background:var(--crema); max-width:440px; width:100%; border-radius:18px; padding:36px 30px;
    box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center; border-top:8px solid var(--rojo); }
  h1 { margin:0 0 6px; font-size:2rem; color:var(--rojo); }
  p.sub { margin:0 0 26px; color:#555; }
  input { width:100%; padding:14px; font-size:1rem; border:2px solid #d9cbb5; border-radius:10px; background:#fff; }
  input:focus { outline:none; border-color:var(--verde); }
  button { margin-top:14px; width:100%; padding:14px; font-size:1.05rem; font-family:inherit; border:0; border-radius:10px;
    background:var(--rojo); color:#fff; cursor:pointer; }
  button:disabled { opacity:.6; cursor:wait; }
  #res { margin-top:24px; min-height:24px; }
  .nombre { font-size:2.4rem; color:var(--verde); font-weight:bold; margin:8px 0; }
  .error { color:var(--rojo); }
  .nota { font-size:.85rem; color:#777; margin-top:22px; }
</style>
</head>
<body>
<main class="tarjeta">
  <h1>🎄🎅 Amigo invisible familia Linares-Moreno 🤶🎁</h1>
  <p class="sub" style="font-size:1.6rem;margin-bottom:14px">⛄ ❄️ 🦌 ⭐ 🔔</p>
  <p class="sub">Escribe tu correo para descubrir a quién te toca regalar.</p>
  <form id="f">
    <input id="email" type="email" placeholder="tu@correo.com" autocomplete="email" required>
    <button id="btn" type="submit">Descubrir 🎁</button>
  </form>
  <div id="res" aria-live="polite"></div>
  <p class="nota">🤫 Es secreto: no se lo digas a nadie.</p>
</main>
<script>

const SAL = "amigo-invisible-2026";
const enc = new TextEncoder();
const hex = b => [...new Uint8Array(b)].map(x => x.toString(16).padStart(2,"0")).join("");
const unhex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x,16)));
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const res = document.getElementById("res"), btn = document.getElementById("btn");
  const email = document.getElementById("email").value.trim().toLowerCase();
  btn.disabled = true; res.textContent = "Abriendo el sobre…";
  try {
    const id = hex(await crypto.subtle.digest("SHA-256", enc.encode(SAL + ":" + email)));
    const d = DATOS[id];
    if (!d) { res.innerHTML = '<p class="error">Ese correo no está en el sorteo. Revisa que esté bien escrito.</p>'; return; }
    const base = await crypto.subtle.importKey("raw", enc.encode(email), "PBKDF2", false, ["deriveKey"]);
    const k = await crypto.subtle.deriveKey({ name:"PBKDF2", salt:enc.encode(SAL), iterations:200000, hash:"SHA-256" },

  } finally { btn.disabled = false; }
});
</script>
</body>
</html>
